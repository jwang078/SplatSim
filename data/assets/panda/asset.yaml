# Franka Panda (URDF + meshes from pybullet_data), a complete robot folder.
# Copy this folder, replace the URDF, and edit the few lines below.
#
# Only `urdf_path` is required. Everything under `robot:` is optional —
# omit a key (or write `auto`) and it is derived from the URDF. Run
#   python scripts/check_robot.py panda
# to see what the simulator derived.
urdf_path: panda.urdf

# Where the robot's base sits in the scene (metres, radians).
base_position: [0.0, 0.0, 0.0]
base_orientation_rpy: [0.0, 0.0, 0.0]

robot:
  base: fixed                     # fixed | planar (x/y/yaw, no physics) | wheeled
  arm_joints: auto                # the 7 panda_joint* joints
  ee_link: panda_hand             # goal / tool frame; auto would pick this too
  initial_joint_positions: [0.0, -0.785, 0.0, -2.356, 0.0, 1.571, 0.785]
  gripper:
    kind: synergies               # one command drives both fingers
    joints: [panda_finger_joint1] # finger_joint2 mimics it in the URDF
    open:   [0.04]                # joint value at command 0
    closed: [0.0]                 #                ... at command 1
  cameras:                        # any number; [] for none. Each becomes an
    - name: wrist                 #   observation "<name>_rgb"
      link: wrist_camera_link     # a link in the URDF beside the hand, with RGB axis visuals
      offset_xyz: [0.0, 0.0, 0.0]   # metres, in the link frame
      offset_rpy: [0.0, 0.0, 0.0]   # the camera looks down its own +Z; image-up is -Y
      model: pinhole              # pinhole | fisheye_v1 | fisheye_v2 (shipped GoPro calibrations)
      fov_deg: 70                 # pinhole only; omit to match the scene camera
    - name: elbow
      link: elbow_camera_link     # a link off panda_link4 in the URDF, with RGB axis visuals
      model: pinhole
      fov_deg: 90
